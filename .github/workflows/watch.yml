name: UT Bot AVAX watcher

on:
  # Every minute is not honoured by GitHub's scheduler and just gets dropped
  # (observed: ~1 run per 30-45 min, then nothing at all). A 5-minute tick is
  # ample for a 30-minute signal and keeps the queue clean.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  watch-m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE: actions/cache is IMMUTABLE for a given key. A fixed key means the
      # save is always skipped ("Cache hit occurred on the primary key ..., not
      # saving cache"), so the dedupe state never advances and the watcher
      # re-primes on every run -> it stays silent forever. The key therefore
      # rotates per run, and restore-keys picks up the most recent entry.
      - name: Restore M1 state
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m1-state-${{ github.run_id }}
          restore-keys: |
            utbot-avax-m1-state-

      - name: Run M1 watcher
        run: |
          mkdir -p state
          python utbot_avaxusdt_1m.py > output_m1.txt 2>&1 || true
          cat output_m1.txt

      - name: Save M1 state
        if: always()
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m1-state-${{ github.run_id }}
          restore-keys: |
            utbot-avax-m1-state-

      - name: Push M1 to ntfy
        run: |
          OUTPUT=$(cat output_m1.txt)
          if [ -n "$OUTPUT" ]; then
            curl -s -X POST -H "Title: AVAX UT Bot 1m" -H "Tags: chart_with_upwards_trend" -d "$OUTPUT" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          fi

  watch-m30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore M30 state
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m30-state-${{ github.run_id }}
          restore-keys: |
            utbot-avax-m30-state-

      - name: Debug endpoint reachability
        run: |
          python3 - <<'EOF'
          import urllib.request, json
          tests = [
            ("binance SPOT (data-api)", "https://data-api.binance.vision/api/v3/klines?symbol=AVAXUSDT&interval=30m&limit=3"),
            ("binance FUTURES (fapi)",  "https://fapi.binance.com/fapi/v1/klines?symbol=AVAXUSDT&interval=30m&limit=3"),
            ("bybit LINEAR",            "https://api.bybit.com/v5/market/kline?category=linear&symbol=AVAXUSDT&interval=30&limit=3"),
            ("okx SWAP",                "https://www.okx.com/api/v5/market/candles?instId=AVAX-USDT-SWAP&bar=30m&limit=3"),
            ("gateio FUTURES",          "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=AVAX_USDT&interval=30m&limit=3"),
          ]
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "curl/8"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                  print(f"OK    {name}: http {r.status}, {len(body)} bytes")
              except Exception as e:
                  print(f"FAIL  {name}: {type(e).__name__} {e}")
          EOF

      - name: Run M30 watcher
        run: |
          mkdir -p state
          echo "=== STATE BEFORE ==="
          cat state/utbot_avaxusdt_30m.json 2>/dev/null || echo "(none)"
          python utbot_avaxusdt_30m.py > output_m30.txt 2>&1 || true
          echo "=== SCRIPT OUTPUT ==="
          cat output_m30.txt
          echo "=== STATE AFTER ==="
          cat state/utbot_avaxusdt_30m.json 2>/dev/null || echo "(none)"

      - name: Save M30 state
        if: always()
        uses: actions/cache@v4
        with:
          path: state
          key: utbot-avax-m30-state-${{ github.run_id }}
          restore-keys: |
            utbot-avax-m30-state-

      - name: Push M30 to ntfy
        run: |
          OUTPUT=$(cat output_m30.txt)
          if [ -n "$OUTPUT" ]; then
            curl -s -X POST -H "Title: AVAX UT Bot 30m" -H "Tags: chart_with_upwards_trend" -d "$OUTPUT" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          fi
